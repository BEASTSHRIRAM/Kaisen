[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaisen"
version = "0.1.0"
description = "Kaisen security monitoring and anomaly detection platform"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]